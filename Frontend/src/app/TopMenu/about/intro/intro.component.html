<div *ngIf="loaded; else loading">
  <div class="h1-abweichung">{{ 'about.title' | translate | async }}</div>
  <div class="h2-abweichung-dunkel">{{ 'about.subtitle' | translate | async }}</div>
<div class="intro-component">

<div class="intro-block box-links">

  <div class="image-grid">
    <div class="image-square"></div>
    <div class="image-square profile-image" (mouseenter)="toggleZoom($event)" (mouseleave)="toggleZoom($event)"></div>
    <button class="image-square dishlist" (click)="navigateToPortfolio()"></button>
    <div class="image-square gruenblau"></div>
    <div class="image-square bonn-ansicht2" (mouseenter)="toggleZoom($event)" (mouseleave)="toggleZoom($event)"></div>
    <div class="image-square"></div>
    <div class="image-square"></div>
    <div class="image-square tastatur_alt" (mouseenter)="toggleZoom($event)" (mouseleave)="toggleZoom($event)"></div>
    <div class="image-square gelb"></div>
  </div>

</div>
  <div class="intro-block box-rechts">
      <div class="intro-block-text">
        <p class="p-bright-background">{{ 'about.description_zero' | translate | async }}</p>
        <p class="p-bright-background">{{ 'about.description' | translate | async }}</p>
        <!--<p class="p-bright-background">{{ 'about.description_two' | translate | async }}</p> -->
        <p class="p-bright-background">{{ 'about.description_two_alternative' | translate | async }}</p>
      </div>
  </div>
</div>

</div>

  <ng-template #loading>
    <p>Lädt...</p>
  </ng-template>
